<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NatForge - Sign in</title>
    <link rel="icon" href="/assets/img/natforge_flake.ico">
    <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="brand-head">
                <img src="/assets/img/natforge_flake.png" alt="NatForge">
                <div class="name">NatForge</div>
                <div class="tag">Tunnel anything. No port forwarding.</div>
            </div>

            <div class="tabs" data-tabs="auth">
                <button class="tab active" data-tab="signin">Sign in</button>
                <button class="tab" data-tab="register">Create account</button>
            </div>

            <div class="tab-panel active" data-panel="signin" data-group="auth">
                <form id="loginForm">
                    <div class="field">
                        <label class="lbl">Email</label>
                        <input type="email" id="loginEmail" class="input" required>
                    </div>
                    <div class="field">
                        <label class="lbl">Password</label>
                        <input type="password" id="loginPassword" class="input" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
                </form>
            </div>

            <div class="tab-panel" data-panel="register" data-group="auth">
                <form id="registerForm">
                    <div class="field">
                        <label class="lbl">Email</label>
                        <input type="email" id="regEmail" class="input" required>
                    </div>
                    <div class="field">
                        <label class="lbl">Password <span class="faint small">(min 8 characters)</span></label>
                        <input type="password" id="regPassword" class="input" minlength="8" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Create account</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/client.js"></script>
    <script src="/assets/js/app.js"></script>
    <script>
        function go(role) { window.location.href = role === 'admin' ? '/admin/network' : '/dashboard'; }
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const r = await API.login(loginEmail.value.trim(), loginPassword.value);
                API.setSession(r.token, r.role); go(r.role);
            } catch (err) { toast(err.message, 'danger'); }
        });
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const r = await API.register(regEmail.value.trim(), regPassword.value);
                API.setSession(r.token, r.role);
                toast(`Account created (role: ${r.role})`, 'success');
                setTimeout(() => go(r.role), 700);
            } catch (err) { toast(err.message, 'danger'); }
        });
    </script>
</body>
</html>
