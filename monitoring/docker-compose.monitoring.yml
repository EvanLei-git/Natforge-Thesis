# Self-hosted observability for NatForge: host metrics (node_exporter) scraped by
# Prometheus and visualised in Grafana. Grafana is exposed only on localhost:3030
# and reached publicly through the Cloudflare tunnel at https://grafana.natforge.com
# (see docs/https.md). All three use host networking so Prometheus can scrape
# 127.0.0.1 targets (node_exporter :9100 and, later, the app /metrics endpoint).
name: natforge-monitoring

services:
  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: natforge-node-exporter
    network_mode: host
    pid: host
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--collector.systemd'
    volumes:
      - '/:/host:ro,rslave'

  prometheus:
    image: prom/prometheus:latest
    container_name: natforge-prometheus
    network_mode: host
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.listen-address=127.0.0.1:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: natforge-grafana
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: '3030'
      GF_SERVER_ROOT_URL: https://grafana.natforge.com
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set a strong GRAFANA_ADMIN_PASSWORD in monitoring/.env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  prom-data:
  grafana-data:
