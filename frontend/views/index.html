<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thesis Proxy - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px;">
            <div class="text-center mb-4">
                <h2 class="fw-bold">Thesis Proxy</h2>
                <p class="text-muted">P2P Tunneling Platform</p>
            </div>
            
            <ul class="nav nav-pills mb-3 justify-content-center" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="pills-device-tab" data-bs-toggle="pill" data-bs-target="#pills-device" type="button" role="tab">Device Auth</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab">Web Login</button>
                </li>
            </ul>
            
            <div class="tab-content" id="pills-tabContent">
                <!-- Device Auth Flow -->
                <div class="tab-pane fade show active" id="pills-device" role="tabpanel">
                    <p class="text-center small">Enter the code displayed on your CLI to authorize the device.</p>
                    <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
                        <div class="mb-3">
                            <input type="text" class="form-control text-center text-uppercase fs-4 fw-bold" placeholder="XYZ-ABC" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Authorize Device</button>
                    </form>
                </div>
                
                <!-- Standard Login -->
                <div class="tab-pane fade" id="pills-login" role="tabpanel">
                    <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input type="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
