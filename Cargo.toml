[workspace]
resolver = "2"
members = ["natforge-proto", "website_backend", "proxy_node", "core_proxy_backend"]

[workspace.dependencies]
tokio = { version = "1.34", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
