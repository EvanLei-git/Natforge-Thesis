<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NatForge - Users</title>
    <link rel="icon" href="/assets/img/natforge_flake.ico">
    <link href="/assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <img src="/assets/img/natforge_flake.png" alt="">
                <span class="name">NatForge</span>
            </div>
            <nav class="nav">
                <a href="/admin/network" class="nav-link"><span data-icon="admin"></span> Network</a>
                <a href="/admin/users" class="nav-link active"><span data-icon="users"></span> Users</a>
                <a href="/admin/tunnels" class="nav-link"><span data-icon="activity"></span> Tunnels</a>
            </nav>
            <div class="nav-spacer"></div>
            <a href="/admin/profile" class="nav-link"><span data-icon="user"></span> Profile</a>
            <a href="#" onclick="logout()" class="nav-link danger"><span data-icon="logout"></span> Sign out</a>
        </aside>

        <main class="content">
            <h2 class="page-title">Users</h2>
            <p class="page-sub">Everyone on the network, their tunnels, the IP each agent connects from, and total traffic. Click a user to see their tunnels in detail.</p>

            <div class="stat-grid" id="userStats"></div>

            <div class="card">
                <div class="card-head"><h5>All users</h5></div>
                <div class="card-body flush">
                    <table class="table">
                        <thead><tr><th>User</th><th>Role</th><th>Tunnels</th><th>Total traffic</th><th>Last seen</th><th></th></tr></thead>
                        <tbody id="userRows"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="/client.js"></script>
    <script src="/assets/js/app.js"></script>
    <script>
        let TUNNELS_BY_OWNER = {};
        let TUNNEL_BY_ID = {};
        if (requireAuth(true)) { refresh(); setInterval(refresh, 5000); }

        async function refresh() {
            try {
                const [users, tunnels] = await Promise.all([API.getUsers(), API.getAllTunnels()]);
                TUNNELS_BY_OWNER = {};
                TUNNEL_BY_ID = {};
                tunnels.forEach(t => { (TUNNELS_BY_OWNER[t.owner_id] ||= []).push(t); TUNNEL_BY_ID[t.tunnel_id] = t; });
                renderStats(users);
                renderUsers(users);
            } catch (err) { toast(err.message, 'danger'); }
        }

        function stat(label, value, cls, ic) {
            return `<div class="stat ${cls || ''}"><div class="flex between"><div class="label">${label}</div>${nfIcon(ic)}</div><div class="value">${value}</div></div>`;
        }
        function renderStats(users) {
            const admins = users.filter(u => u.role === 'admin').length;
            const totalBytes = users.reduce((a, u) => a + u.total_bytes, 0);
            const totalTunnels = users.reduce((a, u) => a + u.tunnel_count, 0);
            document.getElementById('userStats').innerHTML =
                stat('Users', users.length, '', 'users') +
                stat('Admins', admins, 'amber', 'admin') +
                stat('Tunnels', totalTunnels, 'green', 'service') +
                stat('Total traffic', fmtBytes(totalBytes), '', 'activity');
        }

        function routeBadges(t) { return t.routes.map(r => `<span class="badge ${r.mode}">${r.label ? escapeHtml(r.label) + ' ' : ''}${r.mode}:${r.local_port}</span>`).join(' '); }

        function detailRow(u) {
            const ts = TUNNELS_BY_OWNER[u.id] || [];
            const isAdmin = u.role === 'admin';
            // Per-user moderation (hidden for admin accounts).
            const userActions = isAdmin ? '' : `
                <div class="row-inline" style="gap:8px; margin-bottom:12px">
                    <button class="btn btn-secondary btn-sm" onclick='toggleBan(${u.id}, ${u.banned})'>${nfIcon('ban')} ${u.banned ? 'Unban' : 'Ban'}</button>
                    <button class="btn btn-danger btn-sm" onclick='removeUser(${u.id}, ${escapeAttr(u.email)})'>${nfIcon('trash')} Delete user</button>
                </div>`;
            const tunnelRows = ts.length ? ts.map(t => {
                const title = t.name ? escapeHtml(t.name) : t.full_host;
                return `<div class="flex between" style="padding:8px 0; border-bottom:1px solid var(--border); gap:12px; flex-wrap:wrap">
                    <div><span class="host">${title}</span>
                         <span class="badge ${t.status}" style="margin-left:8px">${t.status.replace('_',' ')}</span>
                         <div class="faint small">${escapeHtml(t.full_host)} &middot; agent ${t.agent_ip || '-'} &middot; ${routeBadges(t)}</div></div>
                    <div class="row-inline" style="gap:6px; align-items:center">
                        <span class="faint small">${nfIcon('download')} ${fmtBytes(t.bytes_in)} ${nfIcon('upload')} ${fmtBytes(t.bytes_out)}</span>
                        <button class="btn btn-secondary btn-sm" title="Edit tunnel" onclick='editTunnel(${t.tunnel_id})'>${nfIcon('edit')}</button>
                        <button class="btn btn-danger btn-sm" onclick='removeTunnel(${t.tunnel_id})'>${nfIcon('trash')}</button>
                    </div>
                </div>`;
            }).join('') : '<div class="faint small">No tunnels.</div>';
            return `<tr class="detail" data-for="${u.id}" style="display:none"><td colspan="6" style="background:var(--bg-sunken)">${userActions}${tunnelRows}</td></tr>`;
        }

        function renderUsers(users) {
            const rows = users.map(u => {
                const roleBadge = u.role === 'admin'
                    ? '<span class="badge" style="color:var(--amber);background:rgba(232,161,58,.14)">admin</span>'
                    : '<span class="badge tag">user</span>';
                const banned = u.banned ? '<span class="badge offline" style="margin-left:6px">banned</span>' : '';
                const name = u.name ? `<span class="faint small"> &middot; ${escapeHtml(u.name)}</span>` : '';
                return `<tr style="cursor:pointer" onclick="toggleUser(${u.id})">
                    <td><div class="host">${escapeHtml(u.email)}${banned}</div><div class="faint small">#${u.id}${name}</div></td>
                    <td>${roleBadge}</td>
                    <td>${u.tunnel_count}</td>
                    <td class="faint small">${fmtBytes(u.total_bytes)}</td>
                    <td class="faint small">${fmtAgo(u.last_seen)}</td>
                    <td class="faint small">${nfIcon('edit')}</td>
                </tr>${detailRow(u)}`;
            }).join('');
            document.getElementById('userRows').innerHTML = rows || '<tr><td colspan="6" class="empty">No users.</td></tr>';
        }

        function toggleUser(uid) {
            const row = document.querySelector(`tr.detail[data-for="${uid}"]`);
            if (row) row.style.display = row.style.display === 'none' ? '' : 'none';
        }

        async function toggleBan(id, currentlyBanned) {
            try { await API.setUserBan(id, !currentlyBanned);
                  toast(currentlyBanned ? 'User unbanned' : 'User banned', 'success'); refresh(); }
            catch (e) { toast(e.message, 'danger'); }
        }
        async function removeUser(id, email) {
            if (!await nfConfirm({ title: 'Delete user', danger: true, confirmText: 'Delete user',
                message: `Delete user ${email}? This removes the account and all their tunnels (ports freed). This cannot be undone.` })) return;
            try { await API.deleteUser(id); toast('User deleted', 'success'); refresh(); }
            catch (e) { toast(e.message, 'danger'); }
        }
        async function editTunnel(id) {
            const t = TUNNEL_BY_ID[id];
            if (!t) return;
            const res = await nfPrompt({ title: 'Edit tunnel', confirmText: 'Save',
                message: 'Changing the subdomain moves the public address (a live tunnel re-routes within a few seconds). The local port is set by the agent (its own machine), so it is shown for reference only.',
                fields: tunnelEditFields(t) });
            if (res === null) return;
            try { await API.editTunnel(id, tunnelEditBody(t, res)); toast('Tunnel updated', 'success'); refresh(); }
            catch (e) { toast(e.message, 'danger'); }
        }
        async function removeTunnel(id) {
            if (!await nfConfirm({ title: 'Delete tunnel', danger: true, confirmText: 'Delete',
                message: 'Delete this tunnel? Its ports are freed and it disappears.' })) return;
            try { await API.deleteTunnel(id); toast('Tunnel deleted', 'success'); refresh(); }
            catch (e) { toast(e.message, 'danger'); }
        }
    </script>
</body>
</html>
