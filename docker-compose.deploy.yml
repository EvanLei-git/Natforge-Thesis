# Full production stack: datastores (included from docker-compose.yml) plus the
# website and core as containers. This is what the VM runs under CD.
#
#   On the VM:  NATFORGE_TAG=<sha|latest> docker compose -f docker-compose.deploy.yml up -d
#
# Images are pulled from ghcr.io; secrets stay on the VM in /etc/natforge/*.env and
# are never baked into the image or committed. Both apps use host networking so the
# core can bind :80/:443/:4000/:3001 + the 20000-20100 TCP pool and the existing
# 127.0.0.1-based config (DATABASE_URL, REDIS_URL, DASHBOARD_ADDR) works unchanged.
include:
  - docker-compose.yml

services:
  website:
    image: ghcr.io/evanlei-git/natforge-website:${NATFORGE_TAG:-latest}
    pull_policy: always
    network_mode: host
    environment:
      # The frontend is baked into the image at /app/frontend. website.env carries a
      # host path (FRONTEND_DIR=/home/.../natforge/frontend) from the native deploy,
      # which does not exist inside the container; this override wins over env_file.
      FRONTEND_DIR: /app/frontend
    env_file:
      - path: /etc/natforge/website.env
        required: false          # present on the VM; optional so local `config` validates
    volumes:
      - /etc/natforge:/etc/natforge:ro   # GeoIP db + any file paths referenced by env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  core:
    image: ghcr.io/evanlei-git/natforge-core:${NATFORGE_TAG:-latest}
    pull_policy: always
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE           # bind :80/:443 as non-root (replaces the systemd AmbientCapability)
    environment:
      # Wildcard cert for auto-HTTPS on http user subdomains. Stays disabled until
      # certbot issues it under /etc/letsencrypt (graceful-off if the file is absent).
      WILDCARD_CERT_PATH: /etc/letsencrypt/live/natforge.com/fullchain.pem
      WILDCARD_KEY_PATH: /etc/letsencrypt/live/natforge.com/privkey.pem
    env_file:
      - path: /etc/natforge/core.env
        required: false
    volumes:
      - /etc/natforge:/etc/natforge:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro   # host-issued wildcard cert (read-only)
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      website: { condition: service_started }
    restart: unless-stopped
