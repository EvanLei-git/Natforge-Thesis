name: Uptime

# Off-VM uptime watcher. Runs on GitHub's infrastructure (not the VM), so it can
# tell you the VM itself is down. If a probe fails, the job fails and GitHub sends
# you its built-in Actions-failure email -> that IS the alert (no extra setup).
#
# Interval note: scheduled runs consume Actions minutes, and each job is billed a
# 1-minute minimum. On a PRIVATE repo (2000 free min/month, shared with CI/CD) an
# hourly probe (~720 min/month) is the cost-safe default. Tighten the cron for
# faster detection only if you make the repo public (unlimited Actions) or accept
# the extra minutes; for minute-level checks a free external monitor (e.g.
# UptimeRobot) avoids Actions minutes entirely.

on:
  schedule:
    - cron: '23 * * * *'      # hourly (offset off the top of the hour)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe NatForge (a failure emails you)
        run: |
          set -e
          echo "apex dashboard (https via the Cloudflare tunnel)..."
          curl -fsS --max-time 15 -o /dev/null https://natforge.com/
          echo "www..."
          curl -fsS --max-time 15 -o /dev/null https://www.natforge.com/
          echo "all endpoints responding, NatForge is up"
