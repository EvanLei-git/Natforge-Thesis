<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NatForge — Sign in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-lg p-4" style="width: 100%; max-width: 420px;">
            <div class="text-center mb-4">
                <h2 class="fw-bold mb-0">🔥 NatForge</h2>
                <p class="text-muted">Hybrid Reverse-Proxy &amp; P2P Tunneling</p>
            </div>

            <ul class="nav nav-pills mb-3 justify-content-center" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-login" type="button">Sign in</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-register" type="button">Create account</button>
                </li>
            </ul>

            <div class="tab-content">
                <!-- Login -->
                <div class="tab-pane fade show active" id="tab-login" role="tabpanel">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="loginEmail" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="loginPassword" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Sign in</button>
                    </form>
                </div>

                <!-- Register -->
                <div class="tab-pane fade" id="tab-register" role="tabpanel">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="regEmail" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password <span class="text-muted small">(min 6 chars)</span></label>
                            <input type="password" id="regPassword" class="form-control" minlength="6" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Create account</button>
                        <p class="text-muted small mt-2 mb-0">The first account created becomes the network administrator.</p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../api/client.js"></script>
    <script src="../assets/js/app.js"></script>
    <script>
        function go(role) {
            window.location.href = role === 'admin' ? 'admin.html' : 'dashboard.html';
        }
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const r = await API.login(loginEmail.value.trim(), loginPassword.value);
                API.setSession(r.token, r.role);
                go(r.role);
            } catch (err) { toast(err.message, 'danger'); }
        });
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const r = await API.register(regEmail.value.trim(), regPassword.value);
                API.setSession(r.token, r.role);
                toast(`Account created (role: ${r.role})`, 'success');
                setTimeout(() => go(r.role), 800);
            } catch (err) { toast(err.message, 'danger'); }
        });
    </script>
</body>
</html>
