# NatForge local infrastructure: PostgreSQL (durable) + Redis (ephemeral).
# Bring up with:  docker compose up -d
# Connection strings (defaults used by the backends):
#   DATABASE_URL=postgres://natforge:natforge@127.0.0.1:5432/natforge
#   REDIS_URL=redis://127.0.0.1:6379

services:
  postgres:
    image: postgres:16-alpine
    container_name: natforge-postgres
    environment:
      POSTGRES_USER: natforge
      POSTGRES_PASSWORD: natforge
      POSTGRES_DB: natforge
    ports:
      - "5432:5432"
    volumes:
      - natforge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U natforge"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: natforge-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  natforge-pgdata:
