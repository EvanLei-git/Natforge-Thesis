name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # manual: run a fresh scan on demand (Actions -> Security -> Run workflow)

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.85.3
        with:
          tool: cargo-audit
      - name: cargo audit (reads .cargo/audit.toml triaged ignore-list)
        run: cargo audit

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action reads PR commits on pull_request events
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
